name: Build and Sync Lahori Food Cafe APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'Lahori-Food-Cafe.apk'
      - 'README.md'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-and-sync-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-sync-apk:
    name: Build Latest APK & Replace Lahori-Food-Cafe.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore debug keystore from repository base64
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Android APK (Release if signing secrets exist, otherwise Debug)
        id: build_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Release signing secrets detected. Building Release APK..."
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            export KEYSTORE_PATH="$PWD/my-upload-key.jks"
            gradle :app:assembleRelease --no-daemon
            cp -f app/build/outputs/apk/release/app-release.apk Lahori-Food-Cafe.apk
            rm -f my-upload-key.jks
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "No release signing secrets configured. Building signed Debug APK..."
            gradle :app:assembleDebug --no-daemon
            cp -f app/build/outputs/apk/debug/app-debug.apk Lahori-Food-Cafe.apk
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi
          ls -la --full-time Lahori-Food-Cafe.apk
          sha256sum Lahori-Food-Cafe.apk

      - name: Upload built APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lahori-Food-Cafe-${{ steps.build_apk.outputs.variant }}-apk
          path: Lahori-Food-Cafe.apk
          retention-days: 30

      - name: Commit and push updated Lahori-Food-Cafe.apk to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Lahori-Food-Cafe.apk; then
            echo "Lahori-Food-Cafe.apk is already up to date."
          else
            git add -f Lahori-Food-Cafe.apk
            git commit -m "chore(apk): rebuild Lahori-Food-Cafe.apk (${{ steps.build_apk.outputs.variant }}) from ${GITHUB_SHA::7} [skip ci]"
            git push origin HEAD:main
          fi
